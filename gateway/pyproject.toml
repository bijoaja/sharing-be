[project]
name = "gateway-service"
version = "0.1.0"
description = "Gateway microservice (FastAPI reverse proxy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "strict"
