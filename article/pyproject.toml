[project]
name = "article-service"
version = "0.1.0"
description = "Article microservice (FastAPI + MySQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic-settings>=2.3.4",
    "sqlalchemy[asyncio]>=2.0.31",
    "aiomysql>=0.2.0",
    "alembic>=1.13.2",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "strict"
